name: 매일 공개 기록 갱신

on:
  schedule:
    - cron: "40 22 * * *"   # 매일 07:40 (서울)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/news.csv"   # 기사 기록을 더하면 바로 다시 만든다
      - "build.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 서울부동산정보광장에서 수집
        run: python fetch.py
      - name: 수집 자료 저장
        run: |
          git config user.name "hannamhyundai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "수집 $(TZ=Asia/Seoul date +%F)"
          git push
      - name: 페이지 만들기
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
